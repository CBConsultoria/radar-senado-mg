<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso restrito</title>
<meta name="robots" content="noindex, nofollow">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a;
    display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: #1e293b; padding: 2.5rem; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 90%; max-width: 380px; text-align: center;
  }
  .box h1 { color: #f1f5f9; font-size: 1.25rem; margin: 0 0 1.5rem; }
  input[type=password] {
    width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #f1f5f9; font-size: 1rem; box-sizing: border-box;
    margin-bottom: 1rem;
  }
  button {
    width: 100%; padding: 0.75rem; border-radius: 8px; border: none;
    background: #3b82f6; color: white; font-size: 1rem; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2563eb; }
  #error { color: #f87171; margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="box">
    <h1>Digite a senha para acessar</h1>
    <input type="password" id="pwd" autofocus placeholder="Senha">
    <button onclick="tryDecrypt()">Entrar</button>
    <div id="error"></div>
  </div>

<script>
const SALT = "TNKsODUpsna6nCyijR7ZzA==";
const ITERATIONS = 250000;
const VERIFY = { iv: "sVCixECzGsWS8gLe", ciphertext: "KpSRvFiV3OnuX+Gy7HiX2uqn" };

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

async function deriveKey(password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(SALT);
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    true,
    ["decrypt"]
  );
}

async function tryDecrypt() {
  const pwd = document.getElementById("pwd").value;
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";
  try {
    const key = await deriveKey(pwd);
    const iv = b64ToBytes(VERIFY.iv);
    const ciphertext = b64ToBytes(VERIFY.ciphertext);
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
    const text = new TextDecoder().decode(decrypted);
    if (text !== "OK") throw new Error("bad password");

    const rawKey = await crypto.subtle.exportKey("raw", key);
    sessionStorage.setItem("_k", bytesToB64(new Uint8Array(rawKey)));

    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    window.location.href = next || "landing.html";
  } catch (e) {
    errorEl.textContent = "Senha incorreta. Tente novamente.";
  }
}

document.getElementById("pwd").addEventListener("keydown", function(e) {
  if (e.key === "Enter") tryDecrypt();
});
</script>
</body>
</html>
